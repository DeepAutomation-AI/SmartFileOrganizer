name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --extra dev --extra realtime --python '${{ matrix.python-version }}'
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests
      - name: Tests and coverage
        run: uv run --no-sync python -m pytest
      - name: Build distributions
        run: uv run --no-sync python -m build
